enabled: true
bind_host: 127.0.0.1
bind_port: 8767
chrome_executable: /path/to/chrome
remote_debugging_port: 9225
profile_dir: .runtime/full-completion-chrome-profile
profile_generation: cde-full-completion-v1
headless: false
challenge_timeout_seconds: 25
navigation_timeout_seconds: 60
inter_request_delay_seconds: 2.5
session_idle_timeout_seconds: 300
detail_cache_ttl_seconds: 600
max_queued_requests: 0
detail_concurrency: 4
detail_launch_stagger_seconds: 1.0
max_resources_per_request: 10
max_pages: 100
max_response_bytes: 10485760
capture_failure_screenshots: false
max_screenshot_bytes: 2097152
